<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf4f2">
    <meta name="description" content="Current ESY Sunhome electricity and charging settings.">
    <title>Settings · ESY Sunhome</title>
    <script>
      const themeMedia = matchMedia("(prefers-color-scheme: dark)");
      let themeMode = "auto";
      try {
        const savedMode = localStorage.getItem("esy-theme");
        if (savedMode === "light" || savedMode === "dark") themeMode = savedMode;
      } catch (error) {
        console.warn("Could not read the saved theme preference.", error);
      }
      document.documentElement.dataset.themeMode = themeMode;
      document.documentElement.dataset.theme =
        themeMode === "auto" ? (themeMedia.matches ? "dark" : "light") : themeMode;
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="styles.css?v=40">
    <script src="settings.js?v=3" defer></script>
  </head>
  <body>
    <main class="page settings-page">
      <header class="topbar">
        <a class="brand" href="./" aria-label="ESY Sunhome dashboard">
          <span class="brand-mark" aria-hidden="true">e</span>
          <span>ESY <span class="brand-light">SUNHOME</span></span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="./">Dashboard</a>
          <a href="settings.html" aria-current="page">Settings</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme mode: Auto">
          <span class="theme-icon" id="theme-icon" aria-hidden="true">☾</span>
          <span id="theme-label">Auto</span>
        </button>
      </header>

      <header class="settings-intro">
        <p class="eyebrow">CONFIGURATION</p>
        <h1>Settings</h1>
        <p class="subtitle">Electricity tariff, home battery and BYD DOLPHIN</p>
        <span class="settings-readonly">Read only</span>
      </header>

      <nav class="settings-index" id="settings-index" aria-label="Settings categories" hidden></nav>
      <div id="settings-content" aria-live="polite">
        <p class="settings-feedback" role="status">Loading settings…</p>
      </div>

      <footer class="footer"><span>ESY Sunhome energy dashboard</span></footer>
    </main>
  </body>
</html>
