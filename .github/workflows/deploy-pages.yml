name: Deploy energy dashboard

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "data/data.json"
      - "config/**"
      - "scripts/**"
      - "site/**"
  workflow_run:
    workflows:
      - Fetch today's energy data
      - Plan night charge (manual)
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build recent energy history
        run: python scripts/build_history.py --days 90 --output site/data/history.json

      - name: Build night-charge report
        run: python -m scripts.build_night_charge_report --nights 5 --output site/data/night_charge.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
